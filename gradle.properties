# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# K13-B: 47.2.0 -> 47.4.16 - jars compiled against 47.2.0 register the
# SimpleChannel with a payload layout that 47.4.x runtime does not install on
# the client (all S2C packets logged as "Unknown custom packet identifier:
# mobbattlemusic:main", server-driven playlists/CUE/markers never worked;
# playback appeared to work only because server_playlists.json is also read
# from the client config dir)
forge_version=47.4.16
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

crackerslib_version = 0.3.1.1
crackerslib_version_range = [1.20.1-0.3.1.1,)

mod_id=mobbattlemusic
mod_name=Mob Battle Music
mod_license=Apache 2.0
mod_version=1.20.1-1.1.1.2
mod_group_id=nonamecrackers2.mobbattlemusic
mod_authors=nonamecrackers2
mod_description=Mod that adds battle music for mobs\n\nCommissioned and mod idea by TSEG\n\nFull Credits: https://github.com/nonamecrackers2/mob-battle-music/wiki/Credits